<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackCode</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1>HackCode</h1>
      <span class="tag">Program the robot in Blue-11 assembly — reach the exit</span>
    </header>
    <main>
      <section class="pane code">
        <div class="toolbar">
          <button id="run" title="Assemble, load and run (Ctrl+Enter)">Run</button>
          <button id="continue" title="Resume the paused program">Continue</button>
          <button id="pause" title="Pause at the end of the tick">Pause</button>
          <button id="step" title="One instruction">Step</button>
          <button id="step-tick" title="The rest of this tick">Step tick</button>
          <button id="reset" class="secondary" title="Rebuild the map; the program stays in the editor">Reset map</button>
          <select id="example" title="Replace the editor's program with an example">
            <option value="">Examples…</option>
            <option value="bios">BIOS calls (EMT)</option>
            <option value="raw">Raw device registers</option>
          </select>
          <button id="show-bios" class="secondary" title="Read the BIOS source">BIOS</button>
          <label class="speed">Speed
            <select id="speed">
              <option value="5">5 ticks/s</option>
              <option value="20" selected>20 ticks/s</option>
              <option value="60">60 ticks/s</option>
              <option value="600">600 ticks/s</option>
            </select>
          </label>
        </div>
        <div id="status"></div>
        <div id="editor"></div>
      </section>
      <section class="pane board">
        <canvas id="map"></canvas>
      </section>
      <section class="pane side">
        <div>
          <h2>Robot</h2>
          <div class="bar"><div id="energy-bar"></div></div>
          <pre id="robot"></pre>
        </div>
        <div>
          <h2>CPU</h2>
          <pre id="regs"></pre>
        </div>
        <div>
          <h2>Console</h2>
          <pre id="output"></pre>
        </div>
      </section>
    </main>
    <dialog id="bios">
      <div class="toolbar"><h2>BIOS source — ROM at 140000</h2><button id="close-bios" class="secondary">Close</button></div>
      <pre id="bios-source"></pre>
    </dialog>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackCode</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1>HackCode</h1>
      <span class="tag">Blue-11 console — pre-alpha</span>
    </header>
    <main>
      <section class="pane">
        <div class="toolbar">
          <button id="run">Run</button>
          <span id="status"></span>
        </div>
        <div id="editor"></div>
      </section>
      <section class="pane">
        <h2>Console</h2>
        <pre id="output"></pre>
        <h2>Registers</h2>
        <pre id="regs"></pre>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
